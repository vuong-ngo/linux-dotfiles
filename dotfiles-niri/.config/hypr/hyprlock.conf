# ==================================================================
# Hyprlock Configuration - Minimalist Glassmorphism
# ==================================================================

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = false
    text_trim = true
    fractional_scaling = 2
}

# Disable animations
animations {
    enabled = false
}

# Background render
background {
    monitor =
    path = ~/.cache/current_wallpaper
    color = rgba(18, 18, 22, 1.0)

    blur_passes = 2
    blur_size = 5
    noise = 0.0117
    contrast = 0.90
    brightness = 0.60
    vibrancy = 0.2
}

# --- TOP LEFT: HOST & USER INFO ---
label {
    monitor =
    text = cmd[update:10000] echo "󰌽  $USER@$(hostname)"
    color = rgba(255, 255, 255, 0.75)
    font_size = 13
    font_family = JetBrainsMono NF Medium
    position = 30, -30
    halign = left
    valign = top
}

# --- TOP RIGHT: SYSTEM STATUS (BATTERY & LAYOUT) ---
label {
    monitor =
    text = cmd[update:5000] echo "󰌌 $LAYOUT   󰁹 $(cat /sys/class/power_supply/BAT1/capacity 2>/dev/null || echo 100)%"
    color = rgba(255, 255, 255, 0.75)
    font_size = 13
    font_family = JetBrainsMono NF Medium
    position = -30, -30
    halign = right
    valign = top
}

# --- CLOCK (TIME) ---
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.95)
    font_size = 96
    font_family = JetBrainsMono NF Bold
    position = 0, 190
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.5)
}

# --- DATE DISPLAY ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(210, 215, 230, 0.85)
    font_size = 18
    font_family = JetBrainsMono NF Medium
    position = 0, 110
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

# --- AVATAR FRAME (Clean Minimalist Circle) ---
shape {
    monitor =
    size = 100, 100
    color = rgba(255, 255, 255, 0.05)
    border_size = 1
    border_color = rgba(255, 255, 255, 0.22)
    rounding = -1
    position = 0, 0
    halign = center
    valign = center
}

# --- AVATAR ICON ---
label {
    monitor =
    text = 󰀄
    color = rgba(255, 255, 255, 0.90)
    font_size = 46
    font_family = JetBrainsMono NF
    position = 0, 0
    halign = center
    valign = center
}

# --- USER GREETING ---
label {
    monitor =
    text = Welcome back, <b>$USER</b>
    color = rgba(220, 220, 230, 0.90)
    font_size = 15
    font_family = JetBrainsMono NF Medium
    position = 0, -75
    halign = center
    valign = center
}

# --- PASSWORD INPUT FIELD ---
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.32
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(18, 18, 24, 0.65)
    font_color = rgba(255, 255, 255, 0.95)

    check_color = rgba(255, 255, 255, 0.85)
    fail_color = rgba(244, 63, 94, 0.85)
    capslock_color = rgba(250, 204, 21, 0.85)

    fade_on_empty = false
    rounding = -1

    placeholder_text = <span foreground="gray"><i>󰌾  Password...</i></span>
    hide_input = false

    fail_text = <span foreground="##f43f5e"><i>󰅙  $FAIL <b>($ATTEMPTS)</b></i></span>

    position = 0, -145
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.35)
}

# --- BOTTOM UNLOCK HINT ---
label {
    monitor =
    text = "󰌑  Press Enter to Unlock"
    color = rgba(255, 255, 255, 0.35)
    font_size = 12
    font_family = JetBrainsMono NF
    position = 0, 35
    halign = center
    valign = bottom
}
