# ==============================================================================
# Kitty Configuration - Optimized for Performance & Lightweight Footprint
# Mirrored from foot.ini (Catppuccin Mocha Black); tmux handles panes/history.
# ==============================================================================

# --- Appearance & Font ---
font_family      family="JetBrainsMono Nerd Font" style=SemiBold
bold_font        family="JetBrainsMono Nerd Font" style=ExtraBold
italic_font      family="JetBrainsMono Nerd Font" style="SemiBold Italic"
bold_italic_font family="JetBrainsMono Nerd Font" style="ExtraBold Italic"
font_size        12.0

# --- Window Geometry & Padding ---
term xterm-256color
remember_window_size    no
initial_window_width    1000
initial_window_height   800
window_padding_width    15
hide_window_decorations yes
confirm_os_window_close 0

# --- Performance & Latency Optimizations ---
repaint_delay          10
input_delay            3
sync_to_monitor        yes
update_check_interval  0

# --- Cursor & Trail Animation ---
cursor_blink_interval        0
cursor_trail                 0

# --- Audio & Bell ---
enable_audio_bell    yes
visual_bell_duration 0
window_alert_on_bell yes
bell_on_tab          yes

# --- Scrollback ---
# Small fallback outside tmux; tmux retains 50000 lines per pane.
# Kitty measures this in lines, not MiB.
scrollback_lines        1000
scrollback_pager_history_size 0
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 3.0

# --- Mouse ---
# Hide the pointer when typing.
mouse_hide_wait -1

# --- Security & Clipboard ---
# osc52=enabled
clipboard_control write-clipboard write-primary read-clipboard read-primary

# --- URLs ---
# launch=xdg-open ${url}, osc8-underline=url-mode
url_style     straight
open_url_with default
detect_urls   yes

# --- Transparency & Opacity ---
background_opacity 0.9

# --- Foot palette: Catppuccin Mocha Black ---
foreground #cdd6f4
background #08080c
selection_foreground #08080c
selection_background #b4befe
cursor #cdd6f4
cursor_text_color #08080c
url_color #89b4fa

# Regular Colors
color0 #45475a
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #cba6f7
color6 #94e2d5
color7 #cdd6f4

# Bright Colors
color8 #585b70
color9 #eba0ac
color10 #94e2d5
color11 #f2cdcd
color12 #b4befe
color13 #f5c2e7
color14 #89dceb
color15 #f5e0dc

# --- Tmux owns tabs and panes; retain essential terminal shortcuts ---
tab_bar_style hidden
enabled_layouts stack
clear_all_shortcuts yes
# Keep built-in shell integration, graphics, notifications and URL handling.
shell_integration no-cursor
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map shift+insert paste_from_selection

# Disable new window spawn (spawn-terminal=none)
map ctrl+shift+n no_op

map shift+page_up   scroll_page_up
map shift+page_down scroll_page_down

# Font size adjustments
map ctrl+plus        change_font_size all +1.0
map ctrl+equal       change_font_size all +1.0
map ctrl+kp_add      change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+kp_subtract change_font_size all -1.0
map ctrl+0           change_font_size all 0
map ctrl+kp_0        change_font_size all 0

# Search & URL launch
map ctrl+shift+r show_scrollback
map ctrl+shift+o open_url_current_selection
