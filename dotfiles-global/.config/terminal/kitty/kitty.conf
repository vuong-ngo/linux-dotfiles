# ==============================================================================
# Kitty Configuration - Foot-Matched Catppuccin Mocha Black & Smooth Trail
# ==============================================================================

# --- Font (Matched with Foot: SemiBold / ExtraBold for clear readability) ---
font_family      family="JetBrainsMono Nerd Font" style=SemiBold
bold_font        family="JetBrainsMono Nerd Font" style=ExtraBold
italic_font      family="JetBrainsMono Nerd Font" style="SemiBold Italic"
bold_italic_font family="JetBrainsMono Nerd Font" style="ExtraBold Italic"
font_size        12.0
modify_font      cell_height -1px
undercurl_style  thin-sparse

# --- Window & Performance ---
term                    xterm-256color
window_padding_width    10
hide_window_decorations yes
confirm_os_window_close 0
repaint_delay           10
input_delay             3
sync_to_monitor         yes
update_check_interval   0
mouse_hide_wait         -1
enable_audio_bell       yes
visual_bell_duration    0

# --- Cursor (Foot Block + Smooth Balanced Trail) ---
cursor_shape                 block
cursor_blink_interval        0
cursor_trail                 3
cursor_trail_decay           0.12 0.28
cursor_trail_start_threshold 2
cursor_trail_color           none

# --- Scrollback & Clipboard (Tmux owns scrollback) ---
scrollback_lines  1000
scrollbar         never
clipboard_control write-clipboard write-primary read-clipboard read-primary
url_style         straight
detect_urls       yes

# --- Theme: Catppuccin Mocha Obsidian (Balanced & Vibrant) ---
background_opacity 0.90

foreground           #cdd6f4
background           #0b0c12
selection_foreground #0b0c12
selection_background #b4befe
cursor               #cdd6f4
cursor_text_color    #0b0c12
url_color            #89dceb

# Regular Colors (Catppuccin Mocha)
color0 #45475a
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #cba6f7
color6 #94e2d5
color7 #bac2de

# Bright Colors (Clear Contrast)
color8  #6c7086
color9  #eba0ac
color10 #a6e3a1
color11 #f9e2af
color12 #b4befe
color13 #f5c2e7
color14 #89dceb
color15 #cdd6f4

# --- Architecture: Tmux owns tabs, splits & navigation ---
allow_remote_control no
tab_bar_style        hidden
enabled_layouts      stack
shell_integration    no-cursor
clear_all_shortcuts  yes

# Essential Kitty-only shortcuts (zero conflict with Tmux / Neovim)
map ctrl+shift+c     copy_to_clipboard
map ctrl+shift+v     paste_from_clipboard
map ctrl+plus        change_font_size all +1.0
map ctrl+equal       change_font_size all +1.0
map ctrl+kp_add      change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+kp_subtract change_font_size all -1.0
map ctrl+0           change_font_size all 0
map ctrl+kp_0        change_font_size all 0
