# ==============================================================================
# Alacritty Configuration - High Performance GPU-Accelerated Terminal
# ==============================================================================

[window]
padding = { x = 15, y = 15 }
dynamic_padding = true
decorations = "None"
opacity = 0.9
blur = false

[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "SemiBold"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "ExtraBold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "SemiBold Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "ExtraBold Italic"

[cursor]
style = { shape = "Block", blinking = "Never" }

# --- Foot palette: Catppuccin Mocha Black ---
[colors.primary]
background = "#08080c"
foreground = "#cdd6f4"

[colors.cursor]
text = "#08080c"
cursor = "#cdd6f4"

[colors.selection]
text = "#08080c"
background = "#b4befe"

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#cba6f7"
cyan = "#94e2d5"
white = "#cdd6f4"

[colors.bright]
black = "#585b70"
red = "#eba0ac"
green = "#94e2d5"
yellow = "#f2cdcd"
blue = "#b4befe"
magenta = "#f5c2e7"
cyan = "#89dceb"
white = "#f5e0dc"

# Tmux owns long history; keep a small fallback outside tmux.
[scrolling]
history = 1000
multiplier = 3

[mouse]
hide_when_typing = true

# Audible system bell without a visual flash (same helpers as Foot).
[bell]
duration = 0
command = { program = "sh", args = ["-c", "canberra-gtk-play -i bell -d 'Terminal Bell' 2>/dev/null || pw-play /usr/share/sounds/freedesktop/stereo/bell.oga 2>/dev/null"] }
