# -*- conf -*-
# Configure foot
app-id=foot
title=foot
locked-title=no
term=xterm-256color

# Appearance & Font (Thicker Font Weight Stroke - Compact Font Size 12.0)
pad=15x15
font=JetBrainsMono Nerd Font:style=SemiBold:size=12.0
font-bold=JetBrainsMono Nerd Font:style=ExtraBold:size=12.0
font-italic=JetBrainsMono Nerd Font:style=SemiBold Italic:size=12.0
font-bold-italic=JetBrainsMono Nerd Font:style=ExtraBold Italic:size=12.0

line-height=14
letter-spacing=0

dpi-aware=no
initial-color-theme=dark
initial-window-size-pixels=1000x800

[environment]
COLORTERM=truecolor

[security]
osc52=enabled

[bell]
urgent=yes
notify=no
visual=no
command=canberra-gtk-play -i bell -d "Terminal Bell" 2>/dev/null || pw-play /usr/share/sounds/freedesktop/stereo/bell.oga 2>/dev/null
command-focused=yes

[scrollback]
lines=5000
multiplier=3.0
indicator-position=relative

[url]
launch=xdg-open ${url}
osc8-underline=url-mode

[cursor]
style=beam
blink=yes

[mouse]
alternate-scroll-mode=yes
hide-when-typing=yes

[touch]
long-press-delay=400

[colors-dark]
alpha=0.9

# --- Catppuccin Mocha Black - Soft Edition ---
foreground=cdd6f4
background=08080c
cursor=08080c cdd6f4
# Selection
selection-foreground=08080c
selection-background=b4befe
# URL
urls=89b4fa
# Colors (Regular)
regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=cba6f7
regular6=94e2d5
regular7=cdd6f4
# Colors (Bright)
bright0=585b70
bright1=eba0ac
bright2=94e2d5
bright3=f2cdcd
bright4=b4befe
bright5=f5c2e7
bright6=89dceb
bright7=f5e0dc

