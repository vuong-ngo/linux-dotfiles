# -*- conf -*-
# Configure foot
app-id=foot
title=foot
locked-title=no
term=xterm-256color

# Appearance & Font (Thicker Font Weight Stroke - Compact Font Size 8.0)
pad=15x15
font=JetBrainsMono Nerd Font:style=SemiBold:size=8.0
font-bold=JetBrainsMono Nerd Font:style=ExtraBold:size=8.0
font-italic=JetBrainsMono Nerd Font:style=SemiBold Italic:size=8.0
font-bold-italic=JetBrainsMono Nerd Font:style=ExtraBold Italic:size=8.0

line-height=10
letter-spacing=0

dpi-aware=yes
initial-color-theme=dark
initial-window-size-pixels=1000x800

[environment]
COLORTERM=truecolor

[security]
osc52=enabled

[bell]
urgent=no
notify=yes
visual=no
command=canberra-gtk-play -i bell -d "Terminal Bell" 2>/dev/null || pw-play /usr/share/sounds/freedesktop/stereo/bell.oga 2>/dev/null
command-focused=yes

[scrollback]
lines=5000
multiplier=3.0
indicator-position=relative

[url]
launch=xdg-open ${url}
osc8-underline=url-mode

[cursor]
style=block
blink=no

[mouse]
alternate-scroll-mode=yes
hide-when-typing=yes

[touch]
long-press-delay=400

[colors-dark]
alpha=0.9
# --- Alacritty Signature Palette (Base16 Classic Dark) ---
foreground=d8d8d8
background=181818
cursor=181818 d8d8d8
selection-foreground=181818
selection-background=d8d8d8
urls=75b5aa

# Colors (Regular)
regular0=282828   # black
regular1=ac4242   # red
regular2=90a959   # green
regular3=f4bf75   # yellow
regular4=6a9fb5   # blue
regular5=aa759f   # magenta
regular6=75b5aa   # cyan
regular7=d8d8d8   # white

# Colors (Bright)
bright0=6b6b6b    # bright black
bright1=c55555    # bright red
bright2=aac474    # bright green
bright3=feca88    # bright yellow
bright4=82b8c8    # bright blue
bright5=c28cb8    # bright magenta
bright6=93d3c3    # bright cyan
bright7=f8f8f8    # bright white

[csd]
preferred=none
size=0
border-width=0
button-width=0

[key-bindings]
spawn-terminal=none
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
primary-paste=Shift+Insert
search-start=Control+Shift+r
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
show-urls-launch=Control+Shift+o

[search-bindings]
cancel=Control+g Control+c Escape
commit=Return KP_Enter
find-prev=Control+r
find-next=Control+s
cursor-left=Left Control+b
cursor-right=Right Control+f
cursor-home=Home Control+a
cursor-end=End Control+e
delete-prev=BackSpace
delete-next=Delete
clipboard-paste=Control+v Control+Shift+v Control+y XF86Paste
primary-paste=Shift+Insert

[url-bindings]
cancel=Control+g Control+c Control+d Escape
toggle-url-visible=t

[mouse-bindings]
scrollback-up-mouse=BTN_WHEEL_BACK
scrollback-down-mouse=BTN_WHEEL_FORWARD
font-increase=Control+BTN_WHEEL_BACK
font-decrease=Control+BTN_WHEEL_FORWARD
selection-override-modifiers=Shift
primary-paste=BTN_MIDDLE
select-begin=BTN_LEFT
select-begin-block=Control+BTN_LEFT
select-extend=BTN_RIGHT
select-extend-character-wise=Control+BTN_RIGHT
select-word=BTN_LEFT-2
select-word-whitespace=Control+BTN_LEFT-2
select-quote=BTN_LEFT-3
select-row=BTN_LEFT-4
