# --- Terminal Color Support ---
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm-256color:RGB"

# --- General Settings ---
set -g prefix C-b
set -s escape-time 10
setw -g mode-keys vi
set-window-option -g mode-keys vi

set -g mouse on
set -s set-clipboard external
set -g history-limit 50000
set -g renumber-windows on

set -g base-index 1
setw -g pane-base-index 1

# --- VIM-Style Navigation & Controls ---

# Copy Mode / Visual Mode (Vi Keybindings - Active ONLY in Copy Mode)
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Vim Movement Keys in Copy/Visual Mode
bind-key -T copy-mode-vi h send-keys -X cursor-left
bind-key -T copy-mode-vi j send-keys -X cursor-down
bind-key -T copy-mode-vi k send-keys -X cursor-up
bind-key -T copy-mode-vi l send-keys -X cursor-right
bind-key -T copy-mode-vi u send-keys -X halfpage-up
bind-key -T copy-mode-vi d send-keys -X halfpage-down
bind-key -T copy-mode-vi w send-keys -X next-word
bind-key -T copy-mode-vi b send-keys -X previous-word
bind-key -T copy-mode-vi e send-keys -X end-of-word
bind-key -T copy-mode-vi g send-keys -X history-top
bind-key -T copy-mode-vi G send-keys -X history-bottom

# Mode Activation Keys (Prefix + v or Prefix + [ to enter Visual/Copy mode)
bind v copy-mode
bind C new-session
bind c new-window -c "#{pane_current_path}"

bind ( switch-client -p
bind ) switch-client -n

# Custom Splits (Prefix + | and Prefix + -)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane Switching (Prefix + h/j/k/l or Prefix + C-h/C-j/C-k/C-l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R

# Fast Tab / Window Switching (Alt + Shift + H/L)
bind -n M-H previous-window
bind -n M-L next-window
bind H previous-window
bind L next-window

# Pane Resizing (Prefix + Shift + H/J/K/L - Repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload Config (Prefix + r)
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux config!"

# --- Pane Border & Message Styling ---
set -g pane-border-style "fg=#27272a"
set -g pane-active-border-style "fg=#e4e4e7"
set -g mode-style "bg=#c084fc,fg=#18181b,bold"
set -g message-style "bg=#f59e0b,fg=#18181b,bold"

# --- Appearance (Pure Graphite Flat Islands - Unified with Neovim) ---
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#f4f4f5"

# Window Status Styles (Disable underline / underscore)
set -g window-status-style "none"
set -g window-status-current-style "none"

# Status Left: Unified Mode Island & Session Island (Equal padding)
set -g status-left-length 100
set -g status-left "#{?client_prefix,#[fg=#18181b]#[bg=#f59e0b]#[bold] PREFIX,#{?pane_in_mode,#[fg=#18181b]#[bg=#c084fc]#[bold] VISUAL,#[fg=#18181b]#[bg=#e4e4e7]#[bold] NORMAL}} #[fg=#f4f4f5]#[bg=#27272a]#[bold] #S #[fg=default]#[bg=default] "

# Window Status: Fully Transparent Inactive + Floating Graphite Active Tab (Synced with Bufferline)
set -g window-status-current-format "#[fg=#e4e4e7,bg=#27272a]▎#[fg=#f4f4f5,bg=#27272a,bold] #I #W#{?window_zoomed_flag, ●,} "
set -g window-status-format "#[fg=#71717a,bg=default]  #I #[fg=#a1a1aa,bg=default]#W "
set -g window-status-separator " "

# Status Right: Connected High-Contrast Graphite Date & Clock
set -g status-right-length 100
set -g status-right "#[fg=#f4f4f5,bg=#27272a,bold] %d/%m/%Y #[fg=#18181b,bg=#e4e4e7,bold] %H:%M "

