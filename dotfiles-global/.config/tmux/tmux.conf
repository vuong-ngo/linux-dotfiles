# ==============================================================================
# Tmux Configuration - Minimal Vim-Mode & Pure Graphite Style
# ==============================================================================

# --- Terminal Color Support ---
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm-256color:RGB"

# --- General Settings ---
unbind C-b
set -g prefix C-a
set -s escape-time 0
setw -g mode-keys vi

set -g mouse on
set -s set-clipboard external
set -g history-limit 50000
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# --- Vim Copy Mode (only custom extensions; V/C-v/h/j/k/l/w/b/e/g/G/Esc are built-in) ---
bind v copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi u send-keys -X halfpage-up
bind -T copy-mode-vi d send-keys -X halfpage-down

# --- Windows, Splits & Panes ---
unbind %
unbind '"'
bind c new-window -c "#{pane_current_path}"
bind C new-session
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Fast Window Switching (Alt + Shift + H/L, no prefix)
bind -n M-H previous-window
bind -n M-L next-window

# Reload Config (Prefix + r)
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux config!"

# --- Pane Border & Message Styling ---
set -g pane-border-style "fg=#27272a"
set -g pane-active-border-style "fg=#e4e4e7"
set -g mode-style "bg=#c084fc,fg=#18181b,bold"
set -g message-style "bg=#f59e0b,fg=#18181b,bold"

# --- Status Bar (Pure Graphite Flat Islands - All Bold) ---
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#f4f4f5,bold"

set -g window-status-style "bold"
set -g window-status-current-style "bold"

set -g status-left-length 100
set -g status-left-style "bold"
set -g status-left "#{?client_prefix,#[fg=#18181b]#[bg=#f59e0b]#[bold] PREFIX,#{?pane_in_mode,#[fg=#18181b]#[bg=#c084fc]#[bold] VISUAL,#[fg=#18181b]#[bg=#e4e4e7]#[bold] NORMAL}} #[fg=#f4f4f5]#[bg=#27272a]#[bold] #S #[fg=default]#[bg=default] "

set -g window-status-current-format "#[fg=#e4e4e7,bg=#27272a,bold]▎#[fg=#f4f4f5,bg=#27272a,bold] #I #W#{?window_zoomed_flag, ●,} "
set -g window-status-format "#[fg=#71717a,bg=default,bold]  #I #[fg=#a1a1aa,bg=default,bold]#W "
set -g window-status-separator " "

set -g status-right-length 100
set -g status-right-style "bold"
set -g status-right "#[fg=#f4f4f5,bg=#27272a,bold] %d/%m/%Y #[fg=#18181b,bg=#e4e4e7,bold] %H:%M "
