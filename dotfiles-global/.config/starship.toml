# ==============================================================================
# MODERN PASTEL MINIMALIST - STARSHIP THEME
# ==============================================================================

scan_timeout = 100
command_timeout = 500
add_newline = false

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$line_break\
$character
"""

right_format = """
$python\
$conda\
$cmd_duration\
$status\
"""

# ------------------------------------------------------------------------------
# 1. USER & HOSTNAME (SSH / Root Only)
# ------------------------------------------------------------------------------
[username]
show_always = false
style_user = "bold #cdd6f4"
style_root = "bold #f38ba8"
format = "[$user]($style)@"

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "bold #89b4fa"

# ------------------------------------------------------------------------------
# 2. DIRECTORY (Soft Pastel Blue - Harmonized with Vim & Neovim)
# ------------------------------------------------------------------------------
[directory]
format = "[$path](bold #89b4fa)[$read_only]($read_only_style) "
style = "bold #89b4fa"
truncation_length = 3
truncation_symbol = "../"
truncate_to_repo = false
fish_style_pwd_dir_length = 0
home_symbol = "~"
read_only = " 󰌾"
read_only_style = "bold #f38ba8"

# ------------------------------------------------------------------------------
# 3. GIT INTEGRATION (Clean Modern Symbols, Synced with Neovim & Tmux)
# ------------------------------------------------------------------------------
[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold #cba6f7"

[git_commit]
commit_hash_length = 7
format = "[$hash]($style) "
style = "bold #7f849c"

[git_state]
format = "[$state $progress_current/$progress_total]($style) "
style = "bold #f9e2af"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold #fab387"
conflicted = "✖ "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "
ignore_submodules = true

# ------------------------------------------------------------------------------
# 4. DEV RUNTIMES & LANGUAGES (Harmonized Modern Pastel Accents)
# ------------------------------------------------------------------------------
[python]
format = "[( ($virtualenv))]($style) "
style = "bold #f9e2af"
detect_extensions = []
detect_files = []

[conda]
format = "[󱔎 $environment]($style) "
style = "bold #a6e3a1"
ignore_base = true

# ------------------------------------------------------------------------------
# 5. SYSTEM STATUS & DURATION
# ------------------------------------------------------------------------------
[cmd_duration]
min_time = 2000
format = "[󱎫 $duration]($style) "
style = "bold #f9e2af"

[status]
format = "[$symbol$status]($style) "
symbol = "✘ "
style = "bold #f38ba8"
disabled = false

# ------------------------------------------------------------------------------
# 6. PROMPT CHARACTER (Synced Vi-mode with Tmux / Neovim)
# ------------------------------------------------------------------------------
[character]
success_symbol = '[◆](bold #a6e3a1) '
error_symbol = '[◆](bold #f38ba8) '

vimcmd_symbol = '[◇](bold #fab387) '
vimcmd_visual_symbol = '[◇](bold #cba6f7) '
vimcmd_replace_symbol = '[◇](bold #f38ba8) '
vimcmd_replace_one_symbol = '[◇](bold #89dceb) '
