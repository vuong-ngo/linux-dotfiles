# ==============================================================================
# Kitty Configuration - Optimized for Performance & Lightweight Footprint
# Mirrored from foot.ini (Graphite Palette & Minimalist UI)
# ==============================================================================

# --- Appearance & Font ---
font_family      family="JetBrainsMono Nerd Font" style=SemiBold
bold_font        family="JetBrainsMono Nerd Font" style=ExtraBold
italic_font      family="JetBrainsMono Nerd Font" style="SemiBold Italic"
bold_italic_font family="JetBrainsMono Nerd Font" style="ExtraBold Italic"
font_size        12.0

# --- Window Geometry & Padding ---
term xterm-256color
remember_window_size    no
initial_window_width    1000
initial_window_height   800
window_padding_width    10
hide_window_decorations yes
confirm_os_window_close 0

# --- Performance & Latency Optimizations ---
repaint_delay          10
input_delay            3
sync_to_monitor        yes
update_check_interval  0

# --- Cursor & Trail Animation ---
cursor_blink_interval        0
cursor_trail                 3
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2

# --- Audio & Bell ---
enable_audio_bell    yes
visual_bell_duration 0
window_alert_on_bell yes
bell_on_tab          yes

# --- Scrollback ---
# lines=5000, multiplier=3.0 (lightweight memory footprint)
scrollback_lines        5000
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 3.0

# --- Mouse ---
# hide-when-typing=yes (hide cursor on typing to reduce redraw overhead)
mouse_hide_wait -1

# --- Security & Clipboard ---
# osc52=enabled
clipboard_control write-clipboard write-primary read-clipboard read-primary

# --- URLs ---
# launch=xdg-open ${url}, osc8-underline=url-mode
url_color     #87afd7
url_style     straight
open_url_with default
detect_urls   yes

# --- Transparency & Opacity ---
background_opacity 0.9

# --- Alacritty Signature Palette (Base16 Classic Dark) ---
foreground           #d8d8d8
background           #181818
selection_foreground #181818
selection_background #d8d8d8
cursor               #d8d8d8
cursor_text_color    #181818
url_color            #75b5aa

# Regular Colors
color0  #282828
color1  #ac4242
color2  #90a959
color3  #f4bf75
color4  #6a9fb5
color5  #aa759f
color6  #75b5aa
color7  #d8d8d8

# Bright Colors
color8  #6b6b6b
color9  #c55555
color10 #aac474
color11 #feca88
color12 #82b8c8
color13 #c28cb8
color14 #93d3c3
color15 #f8f8f8

# --- Key Bindings ---
# Mapped 1:1 with foot key-bindings
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map shift+insert paste_from_selection

# Disable new window spawn (spawn-terminal=none)
map ctrl+shift+n no_op

map shift+page_up   scroll_page_up
map shift+page_down scroll_page_down

# Font size adjustments
map ctrl+plus        change_font_size all +1.0
map ctrl+equal       change_font_size all +1.0
map ctrl+kp_add      change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+kp_subtract change_font_size all -1.0
map ctrl+0           change_font_size all 0
map ctrl+kp_0        change_font_size all 0

# Search & URL launch
map ctrl+shift+r show_scrollback
map ctrl+shift+o open_url_current_selection
